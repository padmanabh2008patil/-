<!DOCTYPE html>
<html lang="mr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>किल्ल्याचा इतिहास | इतिहास मराठी किल्ल्यांचा</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }


        /* =========================
           HEADER
        ========================= */

        header {

            background:
            linear-gradient(
                135deg,
                #ff9800,
                #e65100
            );

            color: white;

            text-align: center;

            padding: 30px 15px;

        }


        header h1 {

            font-size: 32px;

            margin-bottom: 10px;

        }


        header p {

            font-size: 17px;

        }


        /* =========================
           MAIN
        ========================= */

        main {

            width: 90%;

            max-width: 1000px;

            margin: 30px auto;

        }


        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {

            display: inline-block;

            background: #e65100;

            color: white;

            text-decoration: none;

            padding: 12px 22px;

            border-radius: 25px;

            margin-bottom: 25px;

            font-size: 16px;

        }


        .back-button:hover {

            background: #bf360c;

        }


        /* =========================
           FORT NAME
        ========================= */

        .fort-title {

            text-align: center;

            color: #e65100;

            font-size: 32px;

            margin-bottom: 25px;

        }


        /* =========================
           HISTORY BOX
        ========================= */

        .history-box {

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
            0 5px 15px
            rgba(0,0,0,0.12);

            line-height: 1.9;

        }


        .history-box h2 {

            color: #e65100;

            margin-bottom: 20px;

            border-bottom:
            2px solid #ff9800;

            padding-bottom: 10px;

        }


        .history-box p {

            font-size: 17px;

            text-align: justify;

            margin-bottom: 15px;

        }


        /* =========================
           NOT FOUND
        ========================= */

        .not-found {

            text-align: center;

            font-size: 18px;

            color: #777;

            padding: 30px;

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            header h1 {

                font-size: 25px;

            }


            .fort-title {

                font-size: 25px;

            }


            .history-box {

                padding: 20px;

            }


            .history-box p {

                font-size: 16px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header>

        <h1>
            🏰 इतिहास मराठी किल्ल्यांचा
        </h1>

        <p>
            महाराष्ट्रातील किल्ल्यांचा डिजिटल वारसा
        </p>

    </header>



    <!-- =========================
         MAIN
    ========================= -->

    <main>


        <!-- BACK BUTTON -->

        <a
            href="fort.html"
            class="back-button"
        >

            ← किल्ल्याच्या माहितीवर परत जा

        </a>



        <!-- FORT NAME -->

        <h1
            class="fort-title"
            id="fortName"
        >

            किल्ला

        </h1>



        <!-- HISTORY -->

        <div
            class="history-box"
            id="historyBox"
        >

            <h2>
                📜 किल्ल्याचा इतिहास
            </h2>

            <div id="historyText">

                माहिती लोड होत आहे...

            </div>

        </div>


    </main>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        /*
        =====================================
        निवडलेला किल्ला मिळवा
        =====================================
        */

        const selectedFort =

            JSON.parse(

                localStorage.getItem(
                    "selectedFort"
                )

            );

        =====================================
        किल्ल्यांचा इतिहास
        =====================================

                </p>

                लढा दिला. या युद्धात तानाजी मालुसरे

                एक लोकप्रिय ठिकाण आहे.

                </p>

            `,



            /* =========================
               3. रायगड
            ========================= */

            "रायगड किल्ला": `

                <p>

                रायगड किल्ला हा छत्रपती शिवाजी

                </p>

                <p>
