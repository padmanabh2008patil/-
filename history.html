<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>किल्ल्याचा इतिहास | इतिहास मराठी किल्ल्यांचा</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    color:#333;
}


/* HEADER */

header{
    background:linear-gradient(135deg,#ff9800,#e65100);
    color:white;
    text-align:center;
    padding:30px 15px;
}

header h1{
    font-size:32px;
    margin-bottom:10px;
}

header p{
    font-size:17px;
}


/* MAIN */

main{
    width:90%;
    max-width:1000px;
    margin:30px auto;
}


/* BACK BUTTON */

.back-button{
    display:inline-block;
    background:#e65100;
    color:white;
    text-decoration:none;
    padding:12px 22px;
    border-radius:25px;
    margin-bottom:25px;
    font-size:16px;
}

.back-button:hover{
    background:#bf360c;
}


/* FORT NAME */

.fort-title{
    text-align:center;
    color:#e65100;
    font-size:32px;
    margin-bottom:25px;
}


/* HISTORY BOX */

.history-box{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.12);
    line-height:1.9;
}

.history-box h2{
    color:#e65100;
    margin-bottom:20px;
    border-bottom:2px solid #ff9800;
    padding-bottom:10px;
}

.history-box p{
    font-size:17px;
    text-align:justify;
    margin-bottom:15px;
}


/* NOT FOUND */

.not-found{
    text-align:center;
    font-size:18px;
    color:#777;
    padding:30px;
}


/* MOBILE */

@media(max-width:600px){

    header h1{
        font-size:25px;
    }

    .fort-title{
        font-size:25px;
    }

    .history-box{
        padding:20px;
    }

    .history-box p{
        font-size:16px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

<h1>
🏰 इतिहास मराठी किल्ल्यांचा
</h1>

<p>
महाराष्ट्रातील किल्ल्यांचा डिजिटल वारसा
</p>

</header>


<!-- MAIN -->

<main>


<!-- BACK BUTTON -->

<a href="fort.html" class="back-button">

← किल्ल्याच्या माहितीवर परत जा

</a>


<!-- FORT NAME -->

<h1 class="fort-title" id="fortName">

किल्ला

</h1>


<!-- HISTORY BOX -->

<div class="history-box">

<h2>
📜 किल्ल्याचा इतिहास
</h2>


<div id="historyText">

माहिती लोड होत आहे...

</div>


</div>


</main>
<script>


/* =========================================
   SELECTED FORT
========================================= */

const selectedFort =
JSON.parse(
    localStorage.getItem("selectedFort")
);


/* =========================================
   FORT NAME
========================================= */

let fortName = "";

if(selectedFort && selectedFort.fort){

    fortName =
    selectedFort.fort.name;

}


/* =========================================
   SHOW FORT NAME
========================================= */

document.getElementById("fortName").innerText =
fortName || "किल्ला";


/* =========================================
   FORT HISTORIES
========================================= */

const histories = {


/* =========================================
   1. देवगिरी
========================================= */

"देवगिरी (दौलताबाद) किल्ला": `

<p>
देवगिरी किल्ला, ज्याला पुढे दौलताबाद
या नावाने ओळखले गेले, हा महाराष्ट्रातील
प्रसिद्ध आणि अभेद्य किल्ल्यांपैकी एक आहे.
हा किल्ला सध्याच्या छत्रपती संभाजीनगर
जिल्ह्यात स्थित आहे.
</p>

<p>
यादव राजवंशाच्या काळात देवगिरीला
विशेष महत्त्व प्राप्त झाले. यादव राजा
भिल्लम पाचवा याने इ.स. १२व्या शतकात
देवगिरीला आपली राजधानी बनवली.
</p>

<p>
किल्ल्याची रचना अत्यंत मजबूत असून
शत्रूला सहजपणे किल्ल्यात प्रवेश करता
येऊ नये यासाठी अनेक संरक्षणात्मक
उपाय करण्यात आले होते.
</p>

<p>
पुढील काळात हा किल्ला दिल्ली सल्तनत,
बहमनी, निजामशाही आणि मुघल सत्तांच्या
ताब्यात राहिला. मोहम्मद बिन तुघलकाने
देवगिरीचे नाव दौलताबाद ठेवून राजधानी
दिल्लीहून येथे हलवण्याचा प्रयत्न केला.
</p>

<p>
देवगिरी किल्ला आज महाराष्ट्राच्या
समृद्ध इतिहासाचे आणि स्थापत्यकलेचे
महत्त्वपूर्ण प्रतीक आहे.
</p>

`,


/* =========================================
   2. सिंहगड
========================================= */

"सिंहगड किल्ला": `

<p>
सिंहगड किल्ला पुणे जिल्ह्यातील
सह्याद्री पर्वतरांगांमध्ये स्थित आहे.
प्राचीन काळात या किल्ल्याला
कोंढाणा असे नाव होते.
</p>

<p>
छत्रपती शिवाजी महाराजांच्या स्वराज्याच्या
इतिहासात सिंहगडाला अत्यंत महत्त्वाचे
स्थान आहे.
</p>

<p>
इ.स. १६७० मध्ये तानाजी मालुसरे यांनी
कोंढाणा किल्ला जिंकण्यासाठी शौर्याने
लढा दिला. या युद्धात तानाजी मालुसरे
वीरमरण पावले.
</p>

<p>
तानाजींच्या बलिदानानंतर छत्रपती
शिवाजी महाराजांनी किल्ल्याचे नाव
कोंढाण्यावरून सिंहगड असे ठेवले.
"गड आला पण सिंह गेला" हे वाक्य
या ऐतिहासिक घटनेशी जोडले जाते.
</p>

<p>
आज सिंहगड हा इतिहासप्रेमी,
पर्यटक आणि गिर्यारोहकांसाठी
एक लोकप्रिय ठिकाण आहे.
</p>

`,


/* =========================================
   3. रायगड
========================================= */

"रायगड किल्ला": `

<p>
रायगड किल्ला हा छत्रपती शिवाजी
महाराजांच्या स्वराज्याची राजधानी
म्हणून प्रसिद्ध आहे. हा किल्ला
रायगड जिल्ह्यात सह्याद्रीच्या
पर्वतरांगांमध्ये स्थित आहे.
</p>

<p>
छत्रपती शिवाजी महाराजांनी इ.स. १६५६
च्या सुमारास हा किल्ला स्वराज्यात
आणला. त्यानंतर किल्ल्याचा मोठ्या
प्रमाणावर विकास करण्यात आला.
</p>

<p>
इ.स. १६७४ मध्ये रायगडावर
छत्रपती शिवाजी महाराजांचा
राज्याभिषेक झाला. या घटनेमुळे
रायगडाला मराठा इतिहासात
अत्यंत महत्त्वाचे स्थान प्राप्त झाले.
</p>

<p>
रायगडावर राजदरबार, बाजारपेठ,
राजवाडा, जगदीश्वर मंदिर आणि
महाराजांची समाधी अशा अनेक
ऐतिहासिक वास्तू आहेत.
</p>

<p>
रायगड हा स्वराज्याच्या वैभवाचा,
छत्रपती शिवाजी महाराजांच्या
कर्तृत्वाचा आणि मराठा साम्राज्याच्या
इतिहासाचा महत्त्वपूर्ण साक्षीदार आहे.
</p>

`,


/* =========================================
   4. राजगड
========================================= */

"राजगड किल्ला": `

<p>
राजगड किल्ला हा पुणे जिल्ह्यातील
सह्याद्री पर्वतरांगांमध्ये वसलेला
एक महत्त्वपूर्ण ऐतिहासिक किल्ला आहे.
</p>

<p>
छत्रपती शिवाजी महाराजांनी राजगडाला
स्वराज्याची राजधानी म्हणून महत्त्व
दिले. हा किल्ला सुमारे २६ वर्षे
स्वराज्याची राजधानी राहिला.
</p>

<p>
राजगडाचे पूर्वीचे नाव मुरुंबदेव
असे होते. छत्रपती शिवाजी महाराजांनी
किल्ल्याचा विस्तार करून त्याला
राजगड हे नाव दिले.
</p>

<p>
किल्ल्याला पद्मावती माची,
सुवेळा माची आणि संजीवनी माची
अशा प्रमुख माच्या आहेत. किल्ल्याची
रचना आणि नैसर्गिक संरक्षण यामुळे
तो अत्यंत मजबूत मानला जातो.
</p>

<p>
स्वराज्याच्या सुरुवातीच्या काळातील
अनेक महत्त्वाच्या घटना राजगडाशी
संबंधित आहेत. त्यामुळे मराठा इतिहासात
राजगडाला विशेष महत्त्व आहे.
</p>

`,


/* =========================================
   5. तोरणा
========================================= */

"तोरणा किल्ला": `

<p>
तोरणा किल्ला हा पुणे जिल्ह्यातील
सह्याद्री पर्वतरांगांमध्ये स्थित
असलेला एक ऐतिहासिक किल्ला आहे.
</p>

<p>
इ.स. १६४६ मध्ये छत्रपती शिवाजी
महाराजांनी तरुण वयात तोरणा किल्ला
जिंकला. हा किल्ला स्वराज्यात
सामील झालेला पहिला महत्त्वाचा
किल्ला मानला जातो.
</p>

<p>
किल्ल्याचे पूर्वीचे नाव प्रचंडगड
असेही होते. किल्ल्याच्या विशाल
आकारामुळे आणि सामरिक महत्त्वामुळे
तोरणा स्वराज्यासाठी अत्यंत महत्त्वाचा
ठरला.
</p>

<p>
तोरणा किल्ल्यावरून छत्रपती शिवाजी
महाराजांनी स्वराज्याच्या विस्ताराची
सुरुवात केली. किल्ल्याच्या परिसरात
अनेक ऐतिहासिक वास्तू आणि अवशेष
आजही पाहायला मिळतात.
</p>

<p>
स्वराज्याच्या स्थापनेच्या इतिहासात
तोरणा किल्ल्याचे स्थान अत्यंत
महत्त्वाचे आहे.
</p>

`,


/* =========================================
   6. पन्हाळा
========================================= */

"पन्हाळा किल्ला": `

<p>
पन्हाळा किल्ला हा कोल्हापूर जिल्ह्यातील
एक प्रसिद्ध आणि ऐतिहासिक किल्ला आहे.
सह्याद्रीच्या पर्वतरांगांमध्ये असलेल्या
या किल्ल्याला मराठा इतिहासात
विशेष महत्त्व आहे.
</p>

<p>
छत्रपती शिवाजी महाराजांनी पन्हाळा
किल्ला स्वराज्यात सामील केला.
किल्ल्याचे भौगोलिक स्थान आणि मजबूत
तटबंदी यामुळे तो सामरिकदृष्ट्या
अत्यंत महत्त्वाचा होता.
</p>

<p>
इ.स. १६६० मध्ये पन्हाळा किल्ल्यावर
सिद्दी जौहरने वेढा दिला. या वेढ्यातून
छत्रपती शिवाजी महाराजांनी विशाळगडाकडे
प्रस्थान केले. या प्रसंगी बाजीप्रभू
देशपांडे यांनी पावनखिंडीत पराक्रम
गाजवला.
</p>

<p>
पन्हाळा किल्ला मराठा साम्राज्याच्या
लष्करी इतिहासातील अनेक महत्त्वाच्या
घटनांचा साक्षीदार आहे.
</p>

<p>
आज पन्हाळा किल्ला हा महाराष्ट्रातील
एक प्रसिद्ध ऐतिहासिक आणि पर्यटनस्थळ
म्हणून ओळखला जातो.
</p>

`

};
  /* =========================================
   HISTORY DISPLAY
========================================= */

const historyText =
document.getElementById("historyText");


if(histories[fortName]){

    historyText.innerHTML =
    histories[fortName];

}
else{

    historyText.innerHTML = `

        <div class="not-found">

            🏰

            <br><br>

            <strong>
            या किल्ल्याचा इतिहास सध्या उपलब्ध नाही.
            </strong>

            <br><br>

            हा इतिहास लवकरच येथे उपलब्ध केला जाईल.

        </div>

    `;

}

</script>


</body>

</html>
