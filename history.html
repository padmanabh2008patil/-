<script>


/* =========================================
   SELECTED FORT
========================================= */

let selectedFort = null;

try{

    selectedFort =
    JSON.parse(
        localStorage.getItem("selectedFort")
    );

}
catch(error){

    console.error(
        "selectedFort डेटा वाचताना त्रुटी:",
        error
    );

}


/* =========================================
   FORT NAME
========================================= */

let fortName = "";

if (selectedFort) {

    if (selectedFort.fort && selectedFort.fort.name) {

        fortName = selectedFort.fort.name.trim();

    } 
    else if (selectedFort.name) {

        fortName = selectedFort.name.trim();

    }

}


/* =========================================
   SHOW FORT NAME
========================================= */

document.getElementById(
    "fortName"
).innerText =
fortName || "किल्ला";
