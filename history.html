<style>

*{

body{

/* HEADER */

header{

main{
    width:90%;

.back-button{
    display:inline-block;
    background:#e65100;
    color:white;

    background:#bf360c;
}

/* FORT NAME */

.fort-title{
    text-align:center;
    color:#e65100;
    font-size:32px;
    margin-bottom:25px;
}

/* HISTORY BOX */

.history-box{
    background:white;
    padding:30px;
    border-radius:15px;

.history-box h2{
    color:#e65100;
    margin-bottom:20px;
    border-bottom:2px solid #ff9800;

}

.history-box p{
    font-size:17px;
    text-align:justify;
    margin-bottom:15px;
}

.not-found{
    text-align:center;
    font-size:18px;
    color:#777;
    padding:30px;

@media(max-width:600px){

    header h1{
        font-size:25px;

        font-size:15px;

    .history-box{

    }

</style>

</head>

<script>


/* =========================================
   SELECTED FORT
========================================= */

let selectedFort = null;

try{

    selectedFort =
    JSON.parse(
        localStorage.getItem("selectedFort")
    );

}
catch(error){

    console.error(
        "selectedFort डेटा वाचताना त्रुटी:",
        error
    );

}


/* =========================================
   FORT NAME
========================================= */

let fortName = "";


/*
   तुमच्या fort.html मधून selectedFort
   खालील प्रकारे सेव्ह होत असल्याचे गृहीत आहे:

   {
       fort: {
           name: "सिंहगड किल्ला"
       }
   }
*/

if(
    selectedFort &&
    selectedFort.fort &&
    selectedFort.fort.name
){

    fortName =
    selectedFort.fort.name.trim();

}


/* =========================================
   SHOW FORT NAME
========================================= */

document.getElementById(
    "fortName"
).innerText =
fortName || "किल्ला";


/* =========================================
   FORT HISTORIES
========================================= */

const histories = {


/* =========================================
   1. देवगिरी (दौलताबाद) किल्ला
========================================= */

"देवगिरी (दौलताबाद) किल्ला": `

<p>
देवगिरी किल्ला, ज्याला पुढे दौलताबाद या नावाने
ओळखले गेले, हा महाराष्ट्रातील प्रसिद्ध आणि
अभेद्य किल्ल्यांपैकी एक आहे. हा किल्ला सध्याच्या
छत्रपती संभाजीनगर जिल्ह्यात स्थित आहे.
</p>

<p>
यादव राजवंशाच्या काळात देवगिरीला विशेष महत्त्व
प्राप्त झाले. यादव राजा भिल्लम पाचवा याने
देवगिरीला आपली राजधानी बनवली.
</p>

<p>
किल्ल्याची रचना अत्यंत मजबूत असून शत्रूला
सहजपणे किल्ल्यात प्रवेश करता येऊ नये यासाठी
अनेक संरक्षणात्मक उपाय करण्यात आले होते.
</p>

<p>
पुढील काळात हा किल्ला दिल्ली सल्तनत, बहमनी,
निजामशाही आणि मुघल सत्तांच्या ताब्यात राहिला.
मोहम्मद बिन तुघलकाने देवगिरीचे नाव दौलताबाद
ठेवून राजधानी दिल्लीहून येथे हलवण्याचा प्रयत्न केला.
</p>

<p>
देवगिरी किल्ला आज महाराष्ट्राच्या समृद्ध इतिहासाचे

`,

गिरिदुर्ग आहे. या किल्ल्याचे प्राचीन नाव
कोंढाणा असे होते. महाराष्ट्राच्या इतिहासात
आणि मराठा साम्राज्याच्या इतिहासात या किल्ल्याला

</p>

<p>
इ.स. १६७० मध्ये छत्रपती शिवाजी महाराजांनी

तानाजी मालुसरे यांच्या नेतृत्वाखाली मोहीम आखली.
तानाजी मालुसरे यांनी आपल्या मावळ्यांसह अत्यंत
शौर्याने किल्ल्यावर चढाई केली आणि मुघल सैन्याशी

</p>

<p>

इतिहासप्रेमी आणि पर्यटकांसाठी लोकप्रिय ठिकाण आहे.
</p>
